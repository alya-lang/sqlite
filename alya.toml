[package]
name = "sqlite"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Fast and lightweight SQLite3 bindings for Alya with bundled C engine (zero external dependencies)"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/sqlite"
keywords = ["alya", "alya-lang", "package", "sqlite", "database", "sql", "sqlite3", "storage"]

[dependencies]

# Optional: feature-gated API slices. Members name another feature;
# gate the using code with `@cfg(feature = "...")` (see `src/lib.alya`
# and `src/types.alya`). `default` is active unless the caller passes
# `--no-default-features`; select features explicitly via
# `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["lifecycle", "write", "read", "row_helpers"]
lifecycle = []
write = []
read = []
row_helpers = []

[build]
links = "sqlite"
c-sources = ["c/sqlite3.c"]
c-flags = ["-O2", "-DSQLITE_THREADSAFE=0", "-DSQLITE_OMIT_LOAD_EXTENSION"]
c-include-dirs = ["c"]

